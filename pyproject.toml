[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "streamlit-activity-calendar"
version = "1.0.0"
description = "Production-quality Streamlit custom component for rendering interactive weekly activity calendars with React frontend"
readme = "README.md"
requires-python = ">=3.8,<4"
license = {text = "MIT"}
authors = [
    {name = "Your Company", email = "info@example.com"}
]
keywords = [
    "streamlit",
    "calendar",
    "react",
    "component",
    "activity",
    "scheduling",
    "custom-component"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Typing :: Typed",
]

dependencies = [
    "streamlit>=1.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=22.0",
    "isort>=5.0",
    "mypy>=0.990",
    "types-setuptools",
]

[project.urls]
Homepage = "https://github.com/yourusername/streamlit-activity-calendar"
Documentation = "https://github.com/yourusername/streamlit-activity-calendar#readme"
Repository = "https://github.com/yourusername/streamlit-activity-calendar.git"
"Bug Tracker" = "https://github.com/yourusername/streamlit-activity-calendar/issues"

[tool.hatch.build.targets.wheel]
packages = ["python/streamlit_activity_calendar"]

[tool.black]
line-length = 88
target-version = ['py38']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | node_modules
)/
'''

[tool.isort]
profile = "black"
line_length = 88
multi_line_mode = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
check_untyped_defs = true
